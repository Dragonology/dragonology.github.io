<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventures in Dragonology</title>
  <meta name="description" content="Illustrations from Adventures in Dragonology">
  <meta name="copyright" content="© 2026 Adventures in Dragonology. All rights reserved.">
  <meta property="og:title" content="Adventures in Dragonology">
  <meta property="og:description" content="Illustrations from Adventures in Dragonology">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/Picture1.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" href="images/Picture1.jpg" as="image">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var savedTheme = localStorage.getItem("dragonology-theme");
      document.documentElement.setAttribute("data-theme", savedTheme || "colorful");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "colorful");
    }
  </script>
</head>
<body>
  <header class="site-header">
    <h1 class="header-title">Adventures in Dragonology</h1>
    <div class="header-ornament" aria-hidden="true">
      <svg class="header-ornament-svg" viewBox="0 0 240 28" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 14 H78 M162 14 H240" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <path d="M78 14 C88 14 92 8 100 8 C108 8 112 14 120 14 C128 14 132 8 140 8 C148 8 152 14 162 14" fill="none" stroke="currentColor" stroke-width="0.75"/>
        <path d="M88 14 C90 18 94 20 100 22 C106 20 110 18 112 14" fill="none" stroke="currentColor" stroke-width="0.6"/>
        <path d="M128 14 C130 18 134 20 140 22 C146 20 150 18 152 14" fill="none" stroke="currentColor" stroke-width="0.6"/>
        <circle cx="120" cy="14" r="2.25" fill="currentColor"/>
        <path d="M120 6 L122 10 L120 14 L118 10 Z" fill="currentColor" opacity="0.85"/>
        <path d="M120 22 L122 18 L120 14 L118 18 Z" fill="currentColor" opacity="0.85"/>
      </svg>
    </div>
  </header>

  <section id="hero" class="hero" hidden></section>
  <main id="gallery" class="gallery" aria-live="polite"></main>

  <footer class="site-footer">
    <p>&copy; 2026 Adventures in Dragonology. All rights reserved.</p>
    <p>All illustrations are proprietary. Not for reproduction or reuse without permission.</p>
    <p class="site-footer-brand">Adventures in Dragonology&trade;</p>
    <div class="theme-toggle" role="group" aria-label="Color theme">
      <span class="theme-toggle-label">Theme</span>
      <button type="button" class="theme-toggle-btn" data-theme-choice="classic" aria-pressed="false">Classic</button>
      <button type="button" class="theme-toggle-btn" data-theme-choice="vivid" aria-pressed="false">Vivid</button>
      <button type="button" class="theme-toggle-btn is-active" data-theme-choice="colorful" aria-pressed="true">Colorful</button>
    </div>
  </footer>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true">
    <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
    <button type="button" class="lightbox-prev" aria-label="Previous image">&lsaquo;</button>
    <button type="button" class="lightbox-next" aria-label="Next image">&rsaquo;</button>
    <div class="lightbox-stage">
      <p class="lightbox-counter" aria-live="polite"></p>
      <figure class="lightbox-figure">
        <img class="lightbox-image" src="" alt="">
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
